<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>অ্যাডমিন প্যানেল | লাইব্রেরি</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // তোমার Firebase Config এখানে বসাও
        const firebaseConfig = {
            apiKey: "AIzaSyCn0W5vaJgE7Oljxab5UdBfSHPrKF45N_o",
            authDomain: "my-asar-library.firebaseapp.com",
            projectId: "my-asar-library",
            storageBucket: "my-asar-library.firebasestorage.app",
            messagingSenderId: "819627173559",
            appId: "1:819627173559:web:5ae892821f9ed6d8fecf32"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // লগইন চেক (সিম্পল পাসওয়ার্ড)
        window.checkLogin = () => {
            const pass = document.getElementById('adminPass').value;
            if(pass === "Ruhamaxnaruto") { // এখানে তোমার পছন্দমতো পাসওয়ার্ড দাও
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                loadBooks();
            } else {
                alert("ভুল পাসওয়ার্ড!");
            }
        }

        // বই অ্যাড করা
        window.addBook = async () => {
            const title = document.getElementById('title').value;
            const qty = document.getElementById('qty').value;
            const category = document.getElementById('category').value;

            if(title && qty) {
                await addDoc(collection(db, "books"), {
                    title: title,
                    qty: qty,
                    category: category,
                    createdAt: new Date()
                });
                alert("বই সফলভাবে অ্যাড হয়েছে!");
                location.reload();
            } 
        }
          
        
        

    for(let book of list) {
        await addDoc(collection(db, "books"), book);
        console.log(book.title + " added!");
    }
    alert("সব বই সফলভাবে আপলোড হয়েছে!");
};


        

        // বইয়ের তালিকা দেখানো ও ডিলিট করা
        async function loadBooks() {
            const querySnapshot = await getDocs(collection(db, "books"));
            const list = document.getElementById('adminBookList');
            list.innerHTML = '';
            querySnapshot.forEach((docSnap) => {
                const book = docSnap.data();
                list.innerHTML += `
                    <div class="flex justify-between bg-gray-100 p-2 mb-2 rounded">
                        <span>${book.title} (${book.qty}টি)</span>
                        <button onclick="deleteBook('${docSnap.id}')" class="text-red-500 font-bold">ডিলিট</button>
                    </div>
                `;
            });
        }

        window.deleteBook = async (id) => {
            if(confirm("বইটি কি ডিলিট করতে চান?")) {
                await deleteDoc(doc(db, "books", id));
                loadBooks();
            }
        }
    </script>
</head>
<body class="bg-gray-200 p-5 font-sans">

    <!-- Login -->
    <div id="loginSection" class="max-w-sm mx-auto bg-white p-6 rounded-lg shadow-lg mt-20 text-center">
        <h2 class="text-xl font-bold mb-4">অ্যাডমিন লগইন</h2>
        <input type="password" id="adminPass" placeholder="পাসওয়ার্ড" class="w-full p-2 border mb-4">
        <button onclick="checkLogin()" class="bg-indigo-600 text-white px-6 py-2 rounded">প্রবেশ করুন</button>
    </div>

    <!-- Admin Panel -->
    <div id="adminSection" class="hidden max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-6 text-indigo-700">নতুন বই যোগ করুন</h2>
        <div class="grid gap-4 mb-8">
            <input type="text" id="title" placeholder="বইয়ের নাম" class="p-2 border rounded">
            <input type="text" id="qty" placeholder="পরিমাণ (যেমন: ১ বা ২)" class="p-2 border rounded">
            <input type="text" id="category" placeholder="ক্যাটাগরি" class="p-2 border rounded">
            <button onclick="addBook()" class="bg-green-600 text-white py-2 rounded font-bold">বই সেভ করুন</button>
        </div>

        <h3 class="font-bold border-t pt-4">বর্তমান বইয়ের তালিকা:</h3>
        <div id="adminBookList" class="mt-4"></div>
    </div>

</body>
</html>
