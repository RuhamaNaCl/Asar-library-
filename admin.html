        // বইয়ের তালিকা দেখানো ও ডিলিট করা
        async function loadBooks() {
            const querySnapshot = await getDocs(collection(db, "books"));
            const list = document.getElementById('adminBookList');
            list.innerHTML = '';
            querySnapshot.forEach((docSnap) => {
                const book = docSnap.data();
                list.innerHTML += `
                    <div class="flex justify-between bg-gray-100 p-2 mb-2 rounded">
                        <span>${book.title} (${book.qty}টি)</span>
                        <button onclick="deleteBook('${docSnap.id}')" class="text-red-500 font-bold">ডিলিট</button>
                    </div>
                `;
            });
        }

        window.deleteBook = async (id) => {
            if(confirm("বইটি কি ডিলিট করতে চান?")) {
                await deleteDoc(doc(db, "books", id));
                loadBooks();
            }
        }
